<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-cyan-blue" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width="1" d="M 40 0 L 0 0 0 40" opacity=".4"/></pattern></defs><style>@keyframes pulse-glow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes flow-line{0%{stroke-dashoffset:400}}@keyframes particle-move-1{0%{cx:100;cy:100;opacity:.2}50%{cx:600;cy:80;opacity:.9}}@keyframes particle-move-2{0%{cx:1100;cy:300;opacity:.2}50%{cx:600;cy:320;opacity:.8}}@keyframes badge-float{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bg-grid{fill:url(#grid)}.glow-orb{animation:pulse-glow 6s ease-in-out infinite;transform-origin:center}.pipeline-path{stroke-dasharray:12,12;animation:flow-line 15s linear infinite}.p-node1{animation:particle-move-1 8s ease-in-out infinite}.p-node2{animation:particle-move-2 10s ease-in-out infinite}.floating-card{animation:badge-float 4s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="400" class="bg-grid" rx="16"/><circle cx="150" cy="100" r="140" fill="#38bdf8" class="glow-orb" filter="url(#glow)" opacity=".12"/><circle cx="1050" cy="300" r="160" fill="#818cf8" class="glow-orb" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="200" r="220" fill="#c084fc" class="glow-orb" filter="url(#glow)" opacity=".06"/><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80 100 Q 350 40 600 100 T 1120 100" class="pipeline-path"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 80 300 Q 350 360 600 300 T 1120 300" class="pipeline-path"/><circle r="5" fill="#38bdf8" class="p-node1" filter="url(#glow)"/><circle r="5" fill="#c084fc" class="p-node2" filter="url(#glow)"/></g><g filter="url(#glow)" opacity=".3"><circle cx="180" cy="100" r="6" fill="#38bdf8"/><circle cx="600" cy="80" r="6" fill="#818cf8"/><circle cx="1020" cy="100" r="6" fill="#c084fc"/><circle cx="300" cy="300" r="6" fill="#38bdf8"/><circle cx="900" cy="300" r="6" fill="#818cf8"/></g><g filter="url(#soft-shadow)"><g class="floating-card" transform="translate(460, 50)"><rect width="280" height="34" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity=".95" rx="17"/><text x="140" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">🚀 DEVOPS ECOSYSTEM 2026</text></g><text x="600" y="165" fill="url(#accent-cyan-blue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" text-anchor="middle">Awesome DevOps Platforms</text><text x="600" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing=".5" text-anchor="middle">Curated SaaS Products &amp; High-Impact Open-Source Software Delivery Infrastructure</text><g><g transform="translate(230, 260) translate(0, 0)"><rect width="160" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8"/><text x="80" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ CI/CD Pipelines</text></g><g transform="translate(230, 260) translate(180, 0)"><rect width="170" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8"/><text x="85" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔄 GitOps Engines</text></g><g transform="translate(230, 260) translate(370, 0)"><rect width="200" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8"/><text x="100" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📦 Release Orchestration</text></g><g transform="translate(230, 260) translate(590, 0)"><rect width="150" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8"/><text x="75" y="24" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">☁️ Cloud Native</text></g></g></g></svg>