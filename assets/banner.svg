<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text/Nodes -->
    <linearGradient id="accent-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    @keyframes flow-line {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes particle-move-1 {
      0% { cx: 100; cy: 100; opacity: 0.2; }
      50% { cx: 600; cy: 80; opacity: 0.9; }
      100% { cx: 1100; cy: 100; opacity: 0.2; }
    }

    @keyframes particle-move-2 {
      0% { cx: 1100; cy: 300; opacity: 0.2; }
      50% { cx: 600; cy: 320; opacity: 0.8; }
      100% { cx: 100; cy: 300; opacity: 0.2; }
    }

    @keyframes badge-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .bg-grid { fill: url(#grid); }
    .glow-orb { animation: pulse-glow 6s ease-in-out infinite; transform-origin: center; }
    .pipeline-path { stroke-dasharray: 12, 12; animation: flow-line 15s linear infinite; }
    .p-node1 { animation: particle-move-1 8s ease-in-out infinite; }
    .p-node2 { animation: particle-move-2 10s ease-in-out infinite; }
    .floating-card { animation: badge-float 4s ease-in-out infinite; }
  </style>

  <!-- Base Layer: Dark Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="400" class="bg-grid" rx="16"/>

  <!-- Dynamic Background Ambient Glowing Orbs -->
  <circle cx="150" cy="100" r="140" fill="#38bdf8" opacity="0.12" class="glow-orb" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="160" fill="#818cf8" opacity="0.12" class="glow-orb" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="220" fill="#c084fc" opacity="0.06" class="glow-orb" filter="url(#glow)"/>

  <!-- Dynamic Animated Pipeline Connection Lines (Behind Text) -->
  <g opacity="0.4">
    <path d="M 80 100 Q 350 40 600 100 T 1120 100" fill="none" stroke="#38bdf8" stroke-width="2" class="pipeline-path"/>
    <path d="M 80 300 Q 350 360 600 300 T 1120 300" fill="none" stroke="#818cf8" stroke-width="2" class="pipeline-path"/>

    <!-- Flowing Particle Lights -->
    <circle class="p-node1" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="p-node2" r="5" fill="#c084fc" filter="url(#glow)"/>
  </g>

  <!-- Decorative Tech Nodes in Background -->
  <g opacity="0.3" filter="url(#glow)">
    <circle cx="180" cy="100" r="6" fill="#38bdf8"/>
    <circle cx="600" cy="80" r="6" fill="#818cf8"/>
    <circle cx="1020" cy="100" r="6" fill="#c084fc"/>
    <circle cx="300" cy="300" r="6" fill="#38bdf8"/>
    <circle cx="900" cy="300" r="6" fill="#818cf8"/>
  </g>

  <!-- Foreground Main Container & Typography (Highest Layer Z-Order) -->
  <g filter="url(#soft-shadow)">
    <!-- Top Pill Tag -->
    <g transform="translate(460, 50)" class="floating-card">
      <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
      <text x="140" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">🚀 DEVOPS ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="url(#accent-cyan-blue)">
      Awesome DevOps Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Curated SaaS Products &amp; High-Impact Open-Source Software Delivery Infrastructure
    </text>

    <!-- Tech Pill Highlights (CI/CD • GitOps • Delivery Pipelines • Release Automation) -->
    <g transform="translate(230, 260)">
      <!-- Pill 1: CI/CD -->
      <g transform="translate(0, 0)">
        <rect width="160" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="80" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ CI/CD Pipelines</text>
      </g>
      <!-- Pill 2: GitOps -->
      <g transform="translate(180, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="85" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔄 GitOps Engines</text>
      </g>
      <!-- Pill 3: Release Automation -->
      <g transform="translate(370, 0)">
        <rect width="200" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="100" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📦 Release Orchestration</text>
      </g>
      <!-- Pill 4: Cloud Native -->
      <g transform="translate(590, 0)">
        <rect width="150" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="75" y="24" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">☁️ Cloud Native</text>
      </g>
    </g>
  </g>
</svg>
